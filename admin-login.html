<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Premier Realty</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-login-page">

  <div class="admin-login-wrap">
    <div class="admin-login-brand">
      <span class="brand-mark" style="width:48px;height:48px;font-size:20px;">PR</span>
      <div>
        <strong>Premier Realty</strong>
        <p>Admin Portal</p>
      </div>
    </div>

    <div class="admin-login-card">
      <h2>Admin Login</h2>
      <p class="admin-login-sub">Access restricted to authorised personnel only.</p>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom:18px;">
          <label>Username</label>
          <input type="text" id="loginUser" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom:24px;">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div class="admin-login-error hidden" id="loginError">Incorrect credentials. Please try again.</div>
        <button type="submit" class="btn-primary full-w">Sign In →</button>
      </form>

      <div class="admin-login-hint">
        <strong>Demo credentials:</strong> admin / premier2024
      </div>
    </div>

    <a href="index.html" class="admin-back-link">← Back to website</a>
  </div>

  <script src="data.js"></script>
  <script>
    if (DB.isAdminLoggedIn()) {
      window.location.href = 'admin.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('loginUser').value.trim();
      var pass = document.getElementById('loginPass').value;
      var err = document.getElementById('loginError');

      if (DB.adminLogin(user, pass)) {
        window.location.href = 'admin.html';
      } else {
        err.classList.remove('hidden');
        document.getElementById('loginPass').value = '';
      }
    });
  </script>
</body>
</html>
